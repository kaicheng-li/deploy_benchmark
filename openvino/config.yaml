# OpenVINO 推理配置
# task: text-generation | image-classification | object-detection
task: "text-generation"

convert:
  model_path: "Qwen/Qwen2-7B-Instruct"     # HuggingFace 模型
  output_dir: "./openvino_models"
  precision: "FP16"                         # FP32 / FP16 / INT8 / INT4
  compress_to_fp16: true
  # 图像模型参数
  input_shape: [1, 3, 224, 224]

runtime:
  model_dir: "./openvino_models"
  device: "CPU"                             # CPU / GPU / AUTO / NPU
  num_streams: 2
  enable_profiling: false

benchmark:
  task: "text-generation"
  warmup_requests: 10
  num_requests: 100
  # ── LLM 参数 ──
  max_input_len: 1024
  max_output_len: 512
  prompt_file: "../data/prompts.txt"
  # ── CV 参数 ──
  image_dir: "../data/images"
  batch_size: 1
