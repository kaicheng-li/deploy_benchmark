# Only two ONNX modes are supported in this project:
#   vision - RF-DETR segmentation
#   qwen   - Qwen text generation

mode: "vision"

vision:
  model_path: "../models/rf-detr-seg-medium"
  onnx_file: "./onnx_models/vision.onnx"
  image: "./0000000109.png"
  threshold: 0.5
  opset_version: 18
  provider: "CPUExecutionProvider"
  threads: 4

qwen:
  # Change this to your local Qwen directory when available.
  model_path: "Qwen/Qwen2-1.5B-Instruct"
  onnx_file: "./onnx_models/qwen.onnx"
  prompt: "Hello, introduce yourself briefly."
  max_new_tokens: 64
  seq_len: 32
  opset_version: 18
  provider: "CPUExecutionProvider"
  threads: 4
