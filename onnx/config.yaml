# ONNX Runtime 推理配置
# task: text-generation | image-classification | object-detection
task: "text-generation"

export:
  model_path: "Qwen/Qwen2-7B-Instruct"   # HuggingFace 模型 ID 或路径
  onnx_dir: "./onnx_models"
  opset_version: 17
  dtype: "float16"                        # float32 / float16
  use_external_data_format: true          # 大模型需要外部数据存储
  # 图像模型导出参数
  input_shape: [1, 3, 224, 224]           # (batch, channel, height, width)
  num_classes: 1000                       # ImageNet

runtime:
  onnx_dir: "./onnx_models"
  provider: "CUDAExecutionProvider"       # CUDAExecutionProvider / CPUExecutionProvider / TensorrtExecutionProvider
  session_options:
    graph_optimization_level: 2           # ORT_ENABLE_ALL
    intra_op_num_threads: 4
    inter_op_num_threads: 2

benchmark:
  task: "text-generation"
  warmup_requests: 10
  num_requests: 100
  # ── LLM 参数 ──
  max_input_len: 1024
  max_output_len: 512
  prompt_file: "../data/prompts.txt"
  # ── CV 参数 ──
  image_dir: "../data/images"             # 图像数据目录
  batch_size: 1                           # 批处理大小
