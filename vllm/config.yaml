# vLLM 推理配置
server:
  host: "0.0.0.0"
  port: 8000
  model: "Qwen/Qwen2-7B-Instruct"   # 替换为你的模型路径或 HuggingFace ID
  trust_remote_code: true
  dtype: "auto"                       # auto / float16 / bfloat16
  max_model_len: 4096
  gpu_memory_utilization: 0.90
  tensor_parallel_size: 1             # GPU 数量
  pipeline_parallel_size: 1
  max_num_seqs: 256

benchmark:
  warmup_requests: 10
  num_requests: 100
  max_concurrency: [1, 4, 8, 16, 32]  # 多并发测试
  prompt_file: "../data/prompts.txt"   # 测试 prompt 文件
  max_input_len: 1024
  max_output_len: 512
