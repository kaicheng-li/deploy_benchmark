# vLLM configuration. All relative paths are resolved from this file.
model:
  id: "Qwen3-VL-8B-Instruct"
  source: "local"
  path: "../models/Qwen3-VL-8B-Instruct"
  format: "transformers"

server:
  host: "0.0.0.0"
  port: 8000
  trust_remote_code: true
  dtype: "auto"
  max_model_len: 4096
  gpu_memory_utilization: 0.90
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  max_num_seqs: 256

benchmark:
  task_type: "multimodal-image-description"
  image: "../onnx/0000000109.png"
  prompt: "请用中文描述这张图片中的主要内容。"
  temperature: 0.0
  top_p: 1.0
  max_tokens: 32
  warmup_requests: 10
  num_requests: 100
  max_concurrency: [1, 2, 4]
