# vLLM configuration. All relative paths are resolved from this file.
model:
  id: "Qwen3-VL-8B-Instruct"
  source: "local"
  path: "../models/Qwen3-VL-8B-Instruct"
  format: "transformers"

server:
  host: "0.0.0.0"
  port: 8000
  trust_remote_code: true
  dtype: "auto"
  max_model_len: 4096
  gpu_memory_utilization: 0.90
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  max_num_seqs: 256

benchmark:
  task_type: "multimodal-image-description"
  image: "../onnx/0000000109.png"
  prompt: "图片描述了什么？"
  warmup_requests: 3
  num_requests: 20
  max_concurrency: [1, 2, 4]
  max_output_len: 128

