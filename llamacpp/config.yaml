# llama.cpp 推理配置
build:
  # llama.cpp 源码目录（如需从源码编译）
  llama_cpp_repo: "https://github.com/ggerganov/llama.cpp.git"
  cmake_options:
    - "-DGGML_CUDA=ON"          # CUDA 加速
    - "-DGGML_BLAS=ON"          # OpenBLAS
    - "-DGGML_METAL=OFF"        # macOS Metal
    - "-DCMAKE_BUILD_TYPE=Release"
  threads: 8

model:
  # GGUF 格式模型路径
  gguf_path: "../models/qwen2-7b-instruct-q4_k_m.gguf"
  # HuggingFace 模型（用于转换）
  hf_model: "Qwen/Qwen2-7B-Instruct"

runtime:
  n_ctx: 4096                   # 上下文长度
  n_threads: 8                  # CPU 线程数
  n_gpu_layers: 32              # GPU 层数 (-1 = 全部)
  batch_size: 512
  seed: 42

benchmark:
  warmup_requests: 5
  num_requests: 50
  max_concurrency: [1, 4]
  max_input_len: 1024
  max_output_len: 512
  prompt_file: "../data/prompts.txt"
