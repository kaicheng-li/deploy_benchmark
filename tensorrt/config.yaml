mode: qwen3vl  # vision | llm | qwen3vl

# Every task references a model here. Local paths are relative to this YAML file.
models:
  rf_detr_seg_medium:
    id: rf-detr-seg-medium
    source: local
    path: ../models/rf-detr-seg-medium
    format: transformers
  qwen3_8b_instruct:
    id: Qwen3-8B-Instruct
    source: huggingface
    path: Qwen/Qwen3-8B-Instruct
    format: transformers
  qwen3_vl_8b_instruct:
    id: Qwen3-VL-8B-Instruct
    source: local
    path: ../models/Qwen3-VL-8B-Instruct
    format: transformers

tasks:
  # Generic TensorRT: RF-DETR PyTorch -> ONNX -> TensorRT engine.
  vision:
    model: rf_detr_seg_medium
    onnx_file: ../onnx/onnx_models/vision.onnx
    engine_file: ./trt_engines/rf_detr_seg.engine
    image: ../onnx/0000000109.png
    threshold: 0.5
    build:
      precision: fp16
      workspace_size_mb: 2048

  # TensorRT-LLM: Qwen Hugging Face checkpoint -> TRT-LLM engine.
  llm:
    model: qwen3_8b_instruct
    build:
      dtype: float16
      max_batch_size: 8
      max_input_len: 2048
      max_output_len: 512
      max_beam_width: 1
      quantization: null
      use_gpt_attention_plugin: true
      use_gemm_plugin: false
      engine_dir: ./trt_engines/qwen3_8b
    runtime:
      engine_dir: ./trt_engines/qwen3_8b
    benchmark:
      warmup_requests: 10
      num_requests: 100
      max_concurrency: [1, 4, 8]
      max_input_len: 1024
      max_output_len: 512
      prompt_file: ../data/prompts.txt

  # Qwen3-VL 多模态：TensorRT-LLM >= 1.2.0 通过 PyTorch backend 原生支持，
  # 不需要 convert_checkpoint / trtllm-build，直接 trtllm-serve 加载 HF checkpoint。
  qwen3vl:
    model: qwen3_vl_8b_instruct
    serve:
      host: 0.0.0.0
      port: 8001
      tp_size: 1
      # TensorRT-LLM CLI 的 --max_seq_len 对应统一测试口径中的 max_model_len。
      max_model_len: 4096
      # The client still submits concurrency 1/2/4. On this 24GB GPU, cap the
      # server scheduler at two active multimodal requests to prevent OOM.
      max_batch_size: 2
      max_num_tokens: 2048
      free_gpu_memory_fraction: 0.6
    image: ../onnx/0000000109.png
    prompt: "请用中文描述这张图片中的主要内容。"
    max_new_tokens: 32
    benchmark:
      stream: true
      temperature: 0.0
      top_p: 1.0
      max_tokens: 32
      warmup_requests: 10
      num_requests: 100
      max_concurrency: [1, 2, 4]
      request_timeout_seconds: 180
      resource_sample_interval_seconds: 0.2
      prompt_file: ../data/prompts.txt
