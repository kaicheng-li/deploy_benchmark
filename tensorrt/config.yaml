# TensorRT-LLM configuration. All relative paths are resolved from this file.
model:
  id: "Qwen3-8B-Instruct"
  source: "huggingface"
  path: "Qwen/Qwen3-8B-Instruct"
  format: "transformers"

build:
  dtype: "float16"
  max_batch_size: 8
  max_input_len: 2048
  max_output_len: 512
  max_beam_width: 1
  quantization: null
  use_gpt_attention_plugin: true
  use_gemm_plugin: false
  engine_dir: "./trt_engines"

runtime:
  engine_dir: "./trt_engines"

benchmark:
  warmup_requests: 10
  num_requests: 100
  max_concurrency: [1, 4, 8]
  max_input_len: 1024
  max_output_len: 512
  prompt_file: "../data/prompts.txt"
